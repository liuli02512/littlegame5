<!doctype html><html lang=zh><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>三关小游戏3</title>
<style>
body{font-family:sans-serif;text-align:center;margin:16px;background:#fff;color:#111}
#lv{font-family:SimHei,"黑体","Microsoft YaHei",sans-serif;font-size:38px;font-weight:900;letter-spacing:6px;margin:10px;display:inline-block;color:orange}
#msg{color:#333;background:transparent;font-weight:600}
#a{position:relative;width:90vw;max-width:440px;height:300px;border:1px solid #ccc;margin:10px auto;overflow:hidden;background:#fafafa}
.dot{position:absolute;width:32px;height:32px;border-radius:50%;background:red;border:none;cursor:pointer}
.blk{position:absolute;width:38px;height:38px;border:none;cursor:pointer}
.pair{display:inline-block;width:78px;height:78px;border:2px dashed #999;margin:10px 14px;vertical-align:top;line-height:78px;font-size:26px;color:#fff}
button{font-size:15px;margin:6px;padding:6px 14px}
</style>
<body>
<h1 id=lv>三关小游戏3</h1><p id=msg>&nbsp;</p><div id=a></div>
<button onclick=start()>开始游戏</button>
<button onclick=restart()>重玩当前关</button>
<button onclick=next()>进入下一关</button>
<script>
let lv=1,over=false;
const A=document.getElementById('a'),msg=document.getElementById('msg'),lvEl=document.getElementById('lv');
const r=(m)=>Math.floor(Math.random()*m);
function cls(){A.innerHTML='';msg.textContent='';over=false}
function load(){
  cls();lvEl.textContent='第'+lv+'关';
  lv===1?lv1():lv===2?lv2():lv3();
}
function start(){lv=1;load()}
function next(){
  if(!over){msg.textContent='先完成当前关卡，才能进入下一关';return}
  if(lv<3){lv++;load()}
  else{lvEl.textContent='🎉 全部通关！';msg.textContent='恭喜完成全部三关，可点“重玩当前关”再来一次'}
}
function restart(){lv<=3?load():0}
function win(){
  over=true;
  if(lv===3){A.innerHTML='';lvEl.textContent='🎉 全部通关！';msg.textContent='恭喜完成全部三关，点“重玩当前关”可再来'}
  else msg.textContent='✅ 通关！点“进入下一关”继续';
}
function dot(x,y){let d=document.createElement('button');d.className='dot';d.style.left=x+'px';d.style.top=y+'px';return d}
function lv1(){
  msg.textContent='点击红点全部消除';
  let n=0;
  for(let i=0;i<3;i++){let d=dot(r(300),r(240));d.onclick=()=>{d.remove();if(++n===3)win()};A.appendChild(d)}
}
function lv2(){
  msg.textContent='点击方块即可自动配对';
  const cols=[['red','#f33'],['blue','#36f']];let placed=0;
  cols.forEach(([k,c])=>{
    let z=document.createElement('div');z.className='pair';z.dataset.c=k;z.style.borderColor=c;A.appendChild(z);
  });
  const zones=A.querySelectorAll('.pair');
  cols.flatMap(([k,c])=>[0,1].map(()=>{
    let b=document.createElement('button');b.className='blk';b.style.background=c;b.style.left=r(340)+'px';b.style.top=r(150)+'px';
    b.onclick=()=>{
      let z=[...zones].find(x=>x.dataset.c===k);
      b.style.position='static';b.disabled=true;z.appendChild(b);
      if(++placed===4)win();
    };
    A.appendChild(b);
  }));
}
function lv3(){
  let t=10,got=0;
  msg.textContent=t+'秒内点满5个';
  const ti=setInterval(()=>{if(over)return clearInterval(ti);msg.textContent=(--t)+'秒内点满5个('+got+')';if(t<=0){msg.textContent='⏰ 超时，点“重玩当前关”';over=true;clearInterval(ti)}},1000);
  const spawn=()=>{
    if(over)return;
    let b=dot(r(300),r(160));b.style.background='#d80';b.style.width='24px';b.style.height='24px';
    b.onclick=()=>{if(!over){b.remove();if(++got>=5){clearInterval(ti);win()}}};
    A.appendChild(b);
    setTimeout(spawn,650);
  };
  spawn();
}
</script>
</body></html>
